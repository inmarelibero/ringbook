# The rules the demo trades by. Every number here is illustrative.

[engine]
book_levels = 131072
queue_model_power = 2

[[instruments]]
name = "BTC-PERP"
order_size = "0.001"
max_order_size = "0.01"
max_position = "0.05"
venues = { hyperliquid = "BTC", binance = "BTCUSDT" }

[[instruments]]
name = "ETH-PERP"
order_size = "0.01"
max_order_size = "0.1"
max_position = "0.5"
venues = { hyperliquid = "ETH", binance = "ETHUSDT" }

[strategy]
spread_bps = "4"
inventory_skew_bps = "2"
requote_threshold_bps = "1"

[risk]
max_notional_usd = "10000"
max_orders_per_sec = 20
price_collar_bps = "100"
max_drawdown_usd = "500"

[venues.hyperliquid]
maker_fee_bps = "1.5"
taker_fee_bps = "4.5"
order_latency_us = 50000
ack_latency_us = 50000

[venues.binance]
maker_fee_bps = "2"
taker_fee_bps = "5"
order_latency_us = 30000
ack_latency_us = 30000
