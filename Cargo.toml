[workspace]
resolver = "3"
members = [
    "analysis",
    "crates/api",
    "crates/app",
    "crates/book",
    "crates/clock",
    "crates/core",
    "crates/ctl",
    "crates/engine",
    "crates/feeds",
    "crates/fix",
    "crates/gateway",
    "crates/journal",
    "crates/mock-venue",
    "crates/paper-exchange",
    "crates/replay",
    "crates/ring",
    "crates/telemetry",
    "crates/testkit",
    "crates/venues/binance",
    "crates/venues/hyperliquid",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ringbook-api = { path = "crates/api" }
ringbook-book = { path = "crates/book" }
ringbook-clock = { path = "crates/clock" }
ringbook-core = { path = "crates/core" }
ringbook-ctl = { path = "crates/ctl" }
ringbook-engine = { path = "crates/engine" }
ringbook-feeds = { path = "crates/feeds" }
ringbook-gateway = { path = "crates/gateway" }
ringbook-journal = { path = "crates/journal" }
ringbook-mock-venue = { path = "crates/mock-venue" }
ringbook-paper-exchange = { path = "crates/paper-exchange" }
ringbook-replay = { path = "crates/replay" }
ringbook-ring = { path = "crates/ring" }
ringbook-telemetry = { path = "crates/telemetry" }
ringbook-testkit = { path = "crates/testkit" }
ringbook-venue-binance = { path = "crates/venues/binance" }
ringbook-venue-hyperliquid = { path = "crates/venues/hyperliquid" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
core_affinity = "0.8"
crc32fast = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hdrhistogram = { version = "7", default-features = false }
loom = "0.7"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
proptest = "1"
plotters = { version = "0.3", default-features = false, features = ["line_series", "svg_backend"] }
polars = { version = "0.46", default-features = false, features = ["fmt", "lazy", "dtype-datetime"] }
quanta = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
toml = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
